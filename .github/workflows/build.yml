name: Build firmware (AMOLED 1.75)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build amoled_1_75
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          idf.py -B build-amoled_1_75 -DPRINTSPHERE_HW_VARIANT=amoled_1_75 reconfigure build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: printsphere-amoled_1_75-${{ github.sha }}
          path: |
            build-amoled_1_75/printsphere_idf.bin
            build-amoled_1_75/bootloader/bootloader.bin
            build-amoled_1_75/partition_table/partition-table.bin
            build-amoled_1_75/ota_data_initial.bin
          if-no-files-found: warn
